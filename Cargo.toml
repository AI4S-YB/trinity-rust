[workspace]
resolver = "2"
members = [
    "crates/trinity-common",
    "crates/trinity-kmer",
    "crates/trinity-inchworm",
    "crates/trinity-chrysalis",
    "crates/trinity-butterfly",
    "crates/trinity-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
thiserror = "2"
flate2 = "1"
rayon = "1"
rustc-hash = "2"
dashmap = "6"
